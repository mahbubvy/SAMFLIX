# Builds SAMFLIX on every push to samonline and publishes it as a GitHub release.
# The app checks the latest release and offers to install it.
name: SAMFLIX release

on:
  push:
    branches: [samonline]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ftp_crawler/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samflix-release
  cancel-in-progress: false

env:
  # SHA-256 of the certificate the phones' copy of SAMFLIX is signed with. A release signed
  # with anything else can't be installed as an update, so the workflow refuses to publish it.
  EXPECTED_CERT_SHA256: fa366ba07d6b4758357e15a7ca60cb1dd55eae06baf18f3f999e1ad951a836f0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version number is the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore and check signing key
        env:
          KEYSTORE_B64: ${{ secrets.SAMFLIX_SIGNING_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::The SAMFLIX_SIGNING_KEYSTORE secret is missing."; exit 1; fi
          KEYSTORE="$RUNNER_TEMP/samflix.keystore"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE"
          FOUND=$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
            | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$FOUND" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The SAMFLIX_SIGNING_KEYSTORE secret holds a different key (certificate $FOUND)."
            exit 1
          fi
          echo "SAMFLIX_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Check the APKs' signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/samflix-*-release.apk; do
            FOUND=$("$APKSIGNER" verify --print-certs "$apk" | grep 'certificate SHA-256' | head -1 | sed 's/.*: *//')
            if [ "$FOUND" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$apk is signed with $FOUND, not the SAMFLIX key."
              exit 1
            fi
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same formula as app/build.gradle.kts.
          VERSION="3.1.$(git rev-list --count HEAD)"
          mkdir -p out
          for abi in arm64-v8a armeabi-v7a; do
            cp "app/build/outputs/apk/release/samflix-$abi-release.apk" "out/SAMFLIX-$VERSION-$abi.apk"
          done
          git log -1 --format=%B > notes.txt
          gh release create "v$VERSION" out/*.apk \
            --title "SAMFLIX $VERSION" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA" \
            --latest
